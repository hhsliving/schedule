<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가전팀 편성표 뷰어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

<!--
  이미지 파일명 규칙
  사업부: images/dept-{연도}-{두 자리 월}-{주차}.png
  팀편성: images/team-{연도}-{두 자리 월}-{주차}.png

  tools/batch.py가 아래 WEEKS 배열을 자동으로 갱신합니다.
-->
<script>
const WEEKS = [
  { y: 2026, m: 1, w: 2, span: "01/05 ~ 01/11", cross: false },
  { y: 2026, m: 1, w: 3, span: "01/12 ~ 01/18", cross: false },
  { y: 2026, m: 1, w: 4, span: "01/19 ~ 01/25", cross: false },
  { y: 2026, m: 1, w: 5, span: "01/26 ~ 02/01", cross: true  },
  { y: 2026, m: 2, w: 1, span: "02/02 ~ 02/08", cross: false },
  { y: 2026, m: 2, w: 2, span: "02/09 ~ 02/15", cross: false },
  { y: 2026, m: 2, w: 3, span: "02/16 ~ 02/22", cross: false },
  { y: 2026, m: 2, w: 4, span: "02/23 ~ 03/01", cross: true  },
  { y: 2026, m: 3, w: 1, span: "03/02 ~ 03/08", cross: false },
  { y: 2026, m: 3, w: 2, span: "03/09 ~ 03/15", cross: false },
  { y: 2026, m: 3, w: 3, span: "03/16 ~ 03/22", cross: false },
  { y: 2026, m: 3, w: 4, span: "03/23 ~ 03/29", cross: false },
  { y: 2026, m: 3, w: 5, span: "03/30 ~ 04/05", cross: true  },
  { y: 2026, m: 4, w: 2, span: "04/06 ~ 04/12", cross: false },
  { y: 2026, m: 4, w: 3, span: "04/13 ~ 04/19", cross: false },
  { y: 2026, m: 4, w: 4, span: "04/20 ~ 04/26", cross: false },
  { y: 2026, m: 4, w: 5, span: "04/27 ~ 05/03", cross: true  },
  { y: 2026, m: 5, w: 2, span: "05/04 ~ 05/10", cross: false },
  { y: 2026, m: 5, w: 3, span: "05/11 ~ 05/17", cross: false },
  { y: 2026, m: 5, w: 4, span: "05/18 ~ 05/24", cross: false },
  { y: 2026, m: 5, w: 5, span: "05/25 ~ 05/31", cross: false },
  { y: 2026, m: 6, w: 1, span: "06/01 ~ 06/07", cross: false },
  { y: 2026, m: 6, w: 2, span: "06/08 ~ 06/14", cross: false },
  { y: 2026, m: 6, w: 3, span: "06/15 ~ 06/21", cross: false },
  { y: 2026, m: 6, w: 4, span: "06/22 ~ 06/28", cross: false },
  { y: 2026, m: 6, w: 5, span: "06/29 ~ 07/05", cross: true  },
  { y: 2026, m: 7, w: 2, span: "07/06 ~ 07/12", cross: false },
  { y: 2026, m: 7, w: 3, span: "07/13 ~ 07/19", cross: false },
  { y: 2026, m: 7, w: 4, span: "07/20 ~ 07/26", cross: false },
  { y: 2026, m: 7, w: 5, span: "07/27 ~ 08/02", cross: true  },
  { y: 2026, m: 8, w: 2, span: "08/03 ~ 08/09", cross: false },
  { y: 2026, m: 8, w: 3, span: "08/10 ~ 08/16", cross: false },
  { y: 2026, m: 8, w: 4, span: "08/17 ~ 08/23", cross: false },
  { y: 2026, m: 8, w: 5, span: "08/24 ~ 08/30", cross: false },
  { y: 2026, m: 9, w: 1, span: "08/31 ~ 09/06", cross: true  },
  { y: 2026, m: 9, w: 2, span: "09/07 ~ 09/13", cross: false },
  { y: 2026, m: 9, w: 3, span: "09/14 ~ 09/20", cross: false }
];
</script>

<style>
  :root {
    --ga: #ffff00;
    --li: #ffc000;
    --hit: #add8e6;
    --bg: #15171b;
    --surface: #1e2128;
    --raised: #272b33;
    --line: #333841;
    --text: #e9ecf1;
    --muted: #868d99;
    --dim: #5a616c;
    --ui: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Segoe UI", "Malgun Gothic", sans-serif;
    --mono: "JetBrains Mono", Consolas, "D2Coding", monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
  }

  button,
  select {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
  }

  [hidden] {
    display: none !important;
  }

  /* 상단 도구 모음 */
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 46px;
    padding: 0 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .tabs {
    display: flex;
    align-items: stretch;
    gap: 2px;
    height: 100%;
  }

  .tab {
    position: relative;
    display: grid;
    place-items: center;
    min-width: 68px;
    padding: 0 14px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
  }

  .tab::after {
    content: "";
    position: absolute;
    right: 12px;
    bottom: 0;
    left: 12px;
    height: 2px;
    background: transparent;
  }

  .tab:hover {
    color: var(--text);
  }

  .tab[aria-selected="true"] {
    color: var(--text);
  }

  .tab[aria-selected="true"]::after {
    background: var(--ga);
  }

  .divider {
    width: 1px;
    height: 22px;
    background: var(--line);
  }

  .find {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .find label {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  select {
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--raised);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  select:hover {
    border-color: var(--dim);
  }

  select:disabled {
    opacity: 0.68;
    cursor: default;
  }

  .meta {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .flag {
    flex: none;
    padding: 3px 6px;
    border-radius: 3px;
    background: var(--li);
    color: #1a1d22;
    font-size: 10px;
    font-weight: 800;
  }

  .span,
  .count {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }

  .span {
    color: var(--muted);
  }

  .count {
    min-width: 54px;
    color: var(--dim);
    text-align: right;
  }

  .print-button {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--raised);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
  }

  .print-button:hover {
    border-color: var(--dim);
    background: #303540;
  }

  .print-button:active {
    transform: translateY(1px);
  }

  .print-button svg {
    flex: none;
  }

  /* 메인 편성표 */
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .viewer {
    position: absolute;
    inset: 12px 78px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .viewer img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    min-width: 0;
    min-height: 0;
    border-radius: 2px;
    background: #fff;
    box-shadow: 0 3px 26px rgba(0, 0, 0, 0.5);
    cursor: zoom-in;
    user-select: none;
    -webkit-user-drag: none;
  }

  .nav {
    position: absolute;
    z-index: 2;
    top: 50%;
    width: 50px;
    height: 116px;
    display: grid;
    place-items: center;
    transform: translateY(-50%);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 30px;
    line-height: 1;
    padding-bottom: 4px;
    cursor: pointer;
  }

  .nav.prev {
    left: 14px;
  }

  .nav.next {
    right: 14px;
  }

  .nav:hover:not(:disabled) {
    border-color: var(--dim);
    background: var(--raised);
  }

  .nav:disabled {
    opacity: 0.22;
    cursor: default;
  }

  .hint {
    position: absolute;
    bottom: 7px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.03em;
    white-space: nowrap;
    pointer-events: none;
  }

  .blank {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    text-align: center;
  }

  .blank code {
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--surface);
    color: var(--hit);
    font-family: var(--mono);
    font-size: 12px;
  }

  /* 하단 주차 레일 */
  .rail {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 26px;
    height: 66px;
    padding: 0 18px 11px;
    overflow-x: auto;
    overflow-y: hidden;
    border-top: 1px solid var(--line);
    background: var(--surface);
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  .month-group {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .month-group > b {
    padding-left: 1px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .ticks {
    display: flex;
    gap: 3px;
  }

  .tick {
    position: relative;
    width: 30px;
    padding-top: 12px;
    border: 0;
    background: transparent;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  .tick::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
  }

  .tick:hover {
    color: var(--text);
  }

  .tick:hover::before {
    background: var(--dim);
  }

  .tick[aria-current="true"] {
    color: #15171b;
  }

  .tick[aria-current="true"]::before {
    background: var(--ga);
  }

  .tick[aria-current="true"] span {
    display: block;
    padding: 1px 0;
    border-radius: 3px;
    background: var(--ga);
  }

  .tick[data-today="true"] span {
    display: block;
    padding: 1px 0;
    border-radius: 3px;
    box-shadow: 0 0 0 1.5px #ff3b30;
  }

  .tick[data-cross="true"]::after {
    content: "";
    position: absolute;
    top: 0;
    right: -3px;
    width: 3px;
    height: 4px;
    background: var(--li);
  }

  /* 전체화면 보기 */
  .lightbox {
    position: fixed;
    z-index: 1000;
    inset: 0;
    display: grid;
    grid-template-rows: 54px minmax(0, 1fr);
    width: 100vw;
    height: 100vh;
    background: rgba(7, 8, 10, 0.98);
    backdrop-filter: blur(5px);
  }

  .lightbox::backdrop {
    background: #07080a;
  }

  .lightbox-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px 0 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(30, 33, 40, 0.96);
  }

  .lightbox-title {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
    overflow: hidden;
  }

  .lightbox-sheet {
    flex: none;
    font-size: 15px;
    font-weight: 750;
  }

  .lightbox-week {
    min-width: 0;
    overflow: hidden;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lightbox-help {
    margin-left: auto;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 10px;
    white-space: nowrap;
  }

  .lightbox-close {
    flex: none;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--raised);
    color: var(--text);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }

  .lightbox-stage {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .lightbox-view {
    position: absolute;
    inset: 12px 78px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .lightbox-view img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    min-width: 0;
    min-height: 0;
    background: #fff;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.65);
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }

  .lightbox-nav {
    position: absolute;
    z-index: 2;
    top: 50%;
    width: 54px;
    height: 132px;
    display: grid;
    place-items: center;
    transform: translateY(-50%);
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(30, 33, 40, 0.92);
    color: var(--text);
    font-size: 34px;
    padding-bottom: 4px;
    cursor: pointer;
  }

  .lightbox-nav.prev {
    left: 12px;
  }

  .lightbox-nav.next {
    right: 12px;
  }

  .lightbox-nav:disabled {
    opacity: 0.2;
    cursor: default;
  }

  .lightbox-counter {
    position: absolute;
    z-index: 2;
    right: 18px;
    bottom: 12px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: rgba(30, 33, 40, 0.9);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    pointer-events: none;
  }

  /* 화면에서는 숨기고 인쇄 때만 보이는 전용 영역 */
  #print-area {
    display: none;
  }

  .print-page {
    display: none;
  }

  :focus-visible {
    outline: 2px solid var(--hit);
    outline-offset: 2px;
  }

  @media (max-width: 820px) {
    .bar {
      gap: 9px;
      padding: 0 9px;
    }

    .divider,
    .find label,
    .span,
    .lightbox-help {
      display: none;
    }

    .find {
      gap: 4px;
    }

    select {
      max-width: 74px;
      padding: 0 4px;
      font-size: 11px;
    }

    .meta {
      gap: 6px;
    }

    .count {
      display: none;
    }

    .print-button {
      width: 34px;
      padding: 0;
    }

    .print-button span {
      display: none;
    }

    .viewer {
      inset: 10px 48px 20px;
    }

    .nav {
      width: 38px;
      height: 90px;
    }

    .nav.prev {
      left: 5px;
    }

    .nav.next {
      right: 5px;
    }

    .lightbox-view {
      inset: 10px 50px 14px;
    }

    .lightbox-nav {
      width: 40px;
      height: 96px;
    }

    .lightbox-nav.prev {
      left: 5px;
    }

    .lightbox-nav.next {
      right: 5px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }

  /* =========================================================
     인쇄 전용
     1페이지 사업부, 2페이지 팀편성을 같은 주차로 출력합니다.
     ========================================================= */
  @page {
    size: A4 landscape;
    margin: 5mm;
  }

  @media print {
    html,
    body {
      width: 100% !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
      background: #fff !important;
    }

    body > *:not(#print-area) {
      display: none !important;
    }

    #print-area {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
      background: #fff !important;
    }

    .print-page {
      display: flex !important;
      width: 100% !important;
      height: 200mm !important;
      align-items: center !important;
      justify-content: center !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #fff !important;
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }

    .print-page:first-child {
      break-after: page !important;
      page-break-after: always !important;
    }

    .print-page:last-child {
      break-after: auto !important;
      page-break-after: auto !important;
    }

    .print-page img {
      display: block !important;
      width: auto !important;
      height: auto !important;
      max-width: 100% !important;
      max-height: 100% !important;
      margin: 0 auto !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      object-fit: contain !important;
      print-color-adjust: exact !important;
      -webkit-print-color-adjust: exact !important;
    }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="tabs" role="tablist" aria-label="시트 선택">
    <button class="tab" id="tab-dept" type="button" role="tab" data-sheet="dept" aria-selected="true">사업부</button>
    <button class="tab" id="tab-team" type="button" role="tab" data-sheet="team" aria-selected="false">팀편성</button>
  </div>

  <div class="divider" aria-hidden="true"></div>

  <div class="find">
    <label for="sel-y">찾기</label>
    <select id="sel-y" aria-label="연도"></select>
    <select id="sel-m" aria-label="월"></select>
    <select id="sel-w" aria-label="주차"></select>
  </div>

  <div class="meta">
    <span class="flag" id="flag" hidden>월 교차</span>
    <span class="span" id="span"></span>
    <span class="count" id="count"></span>

    <button class="print-button" id="print-button" type="button" aria-label="현재 주차 PDF 열기">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V2h12v7"></path>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
        <rect x="6" y="14" width="12" height="8"></rect>
      </svg>
      <span>PDF 인쇄</span>
    </button>
  </div>
</header>

<main class="stage">
  <button class="nav prev" id="prev" type="button" aria-label="이전 주">‹</button>

  <div class="viewer" id="viewer">
    <img id="img" alt="편성표" draggable="false">
    <div class="blank" id="miss" hidden>
      이미지를 찾을 수 없습니다<br>
      <code id="miss-path"></code><br>
      <span style="font-size: 12px">images 폴더에 파일이 있는지 확인하세요</span>
    </div>
  </div>

  <button class="nav next" id="next" type="button" aria-label="다음 주">›</button>
  <div class="hint">← → 주 이동 · 1 사업부 · 2 팀편성 · 이미지 클릭 시 전체화면</div>
</main>

<nav class="rail" id="rail" aria-label="주차 이동"></nav>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="편성표 전체화면" aria-hidden="true" hidden>
  <div class="lightbox-bar">
    <div class="lightbox-title">
      <strong class="lightbox-sheet" id="lightbox-sheet"></strong>
      <span class="lightbox-week" id="lightbox-week"></span>
    </div>
    <span class="lightbox-help">← → 주 이동 · 1 사업부 · 2 팀편성 · ESC 닫기</span>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="전체화면 닫기">×</button>
  </div>

  <div class="lightbox-stage">
    <button class="lightbox-nav prev" id="lightbox-prev" type="button" aria-label="이전 주">‹</button>

    <div class="lightbox-view">
      <img id="lightbox-img" alt="확대 편성표" draggable="false">
      <div class="blank" id="lightbox-miss" hidden>
        이미지를 찾을 수 없습니다<br>
        <code id="lightbox-miss-path"></code>
      </div>
    </div>

    <button class="lightbox-nav next" id="lightbox-next" type="button" aria-label="다음 주">›</button>
    <span class="lightbox-counter" id="lightbox-counter"></span>
  </div>
</div>

<!-- 인쇄 시 1페이지 사업부, 2페이지 팀편성만 남습니다. -->
<div id="print-area" aria-hidden="true">
  <section class="print-page" aria-label="사업부 편성표 인쇄 페이지">
    <img id="print-image-dept" alt="">
  </section>
  <section class="print-page" aria-label="팀편성 편성표 인쇄 페이지">
    <img id="print-image-team" alt="">
  </section>
</div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const pad = (number) => String(number).padStart(2, "0");
  const slug = (week) => `${week.y}-${pad(week.m)}-${week.w}`;
  const imagePath = (sheetName, week) => `images/${sheetName}-${slug(week)}.png`;
  const sheetLabel = (sheetName) => (sheetName === "dept" ? "사업부" : "팀편성");

  const list = WEEKS.slice().sort(
    (a, b) => a.y - b.y || a.m - b.m || a.w - b.w
  );

  let index = Math.max(0, list.length - 1);
  let sheet = "dept";
  let lightboxOpen = false;
  let focusBeforeLightbox = null;

  function weekContainsToday(week) {
    const [startText, endText] = week.span.split(" ~ ");
    if (!startText || !endText) return false;

    const [startMonth, startDay] = startText.split("/").map(Number);
    const [endMonth, endDay] = endText.split("/").map(Number);

    let startYear = week.y;
    let endYear = week.y;

    if (startMonth === 12 && endMonth === 1) {
      if (week.m === 1) startYear -= 1;
      if (week.m === 12) endYear += 1;
    }

    const now = Date.now();
    const start = new Date(startYear, startMonth - 1, startDay, 0, 0, 0, 0).getTime();
    const end = new Date(endYear, endMonth - 1, endDay, 23, 59, 59, 999).getTime();
    return now >= start && now <= end;
  }

  function buildRail() {
    const rail = $("rail");
    rail.innerHTML = "";

    let currentGroupKey = "";
    let ticks = null;

    list.forEach((week, itemIndex) => {
      const groupKey = `${week.y}-${week.m}`;

      if (groupKey !== currentGroupKey) {
        currentGroupKey = groupKey;

        const group = document.createElement("div");
        group.className = "month-group";

        const title = document.createElement("b");
        title.textContent = `${week.y} · ${pad(week.m)}월`;

        ticks = document.createElement("div");
        ticks.className = "ticks";

        group.append(title, ticks);
        rail.append(group);
      }

      const button = document.createElement("button");
      button.type = "button";
      button.className = "tick";
      button.dataset.index = String(itemIndex);
      button.dataset.cross = String(Boolean(week.cross));
      button.title = `${week.y}년 ${pad(week.m)}월 ${week.w}주 · ${week.span}`;
      button.innerHTML = `<span>${week.w}주</span>`;

      if (weekContainsToday(week)) {
        button.dataset.today = "true";
      }

      button.addEventListener("click", () => go(itemIndex));
      ticks.append(button);
    });
  }

  function setSelect(select, values, selectedValue, formatter) {
    select.innerHTML = "";

    values.forEach((value) => {
      const option = document.createElement("option");
      option.value = String(value);
      option.textContent = formatter(value);
      option.selected = value === selectedValue;
      select.append(option);
    });

    select.disabled = values.length < 2;
  }

  function syncFind() {
    if (!list.length) return;

    const week = list[index];
    const years = [...new Set(list.map((item) => item.y))];
    const months = [
      ...new Set(list.filter((item) => item.y === week.y).map((item) => item.m)),
    ];
    const weeks = [
      ...new Set(
        list
          .filter((item) => item.y === week.y && item.m === week.m)
          .map((item) => item.w)
      ),
    ];

    setSelect($("sel-y"), years, week.y, (value) => `${value}년`);
    setSelect($("sel-m"), months, week.m, (value) => `${pad(value)}월`);
    setSelect($("sel-w"), weeks, week.w, (value) => `${value}주차`);
  }

  function jumpFromSelects() {
    const year = Number($("sel-y").value);
    const month = Number($("sel-m").value);
    const weekNumber = Number($("sel-w").value);

    const target = list.findIndex(
      (item) => item.y === year && item.m === month && item.w === weekNumber
    );

    if (target >= 0) go(target);
  }

  function handleYearChange() {
    const selectedYear = Number($("sel-y").value);
    const firstForYear = list.findIndex((item) => item.y === selectedYear);
    if (firstForYear >= 0) go(firstForYear);
  }

  function handleMonthChange() {
    const selectedYear = Number($("sel-y").value);
    const selectedMonth = Number($("sel-m").value);
    const firstForMonth = list.findIndex(
      (item) => item.y === selectedYear && item.m === selectedMonth
    );
    if (firstForMonth >= 0) go(firstForMonth);
  }

  function setSheet(nextSheet) {
    if (nextSheet !== "dept" && nextSheet !== "team") return;
    sheet = nextSheet;

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.setAttribute("aria-selected", String(tab.dataset.sheet === sheet));
    });

    render();
  }

  function updateImage(element, missingElement, missingPathElement, path, altText) {
    element.hidden = false;
    missingElement.hidden = true;
    element.alt = altText;

    element.onload = () => {
      element.hidden = false;
      missingElement.hidden = true;
    };

    element.onerror = () => {
      element.hidden = true;
      missingElement.hidden = false;
      missingPathElement.textContent = path;
    };

    element.src = path;
  }

  function render() {
    if (!list.length) {
      $("img").hidden = true;
      $("miss").hidden = false;
      $("miss-path").textContent = "등록된 주차가 없습니다";
      $("prev").disabled = true;
      $("next").disabled = true;
      return;
    }

    const week = list[index];
    const path = imagePath(sheet, week);
    const title = `${week.y}년 ${pad(week.m)}월 ${week.w}주 ${sheetLabel(sheet)} 편성표`;

    $("flag").hidden = !week.cross;
    $("span").textContent = week.span;
    $("count").textContent = `${index + 1} / ${list.length}`;
    $("prev").disabled = index <= 0;
    $("next").disabled = index >= list.length - 1;

    updateImage($("img"), $("miss"), $("miss-path"), path, title);

    document.querySelectorAll(".tick").forEach((tick) => {
      const selected = Number(tick.dataset.index) === index;
      tick.setAttribute("aria-current", String(selected));
      if (selected) {
        tick.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
      }
    });

    syncFind();

    if (lightboxOpen) {
      renderLightbox();
    }
  }

  function go(nextIndex) {
    if (!list.length) return;
    index = Math.max(0, Math.min(list.length - 1, nextIndex));
    render();
  }

  function renderLightbox() {
    if (!list.length) return;

    const week = list[index];
    const path = imagePath(sheet, week);
    const title = `${week.y}년 ${pad(week.m)}월 ${week.w}주 ${sheetLabel(sheet)} 편성표`;

    $("lightbox-sheet").textContent = sheetLabel(sheet);
    $("lightbox-week").textContent = `${week.y}년 ${pad(week.m)}월 ${week.w}주 · ${week.span}`;
    $("lightbox-counter").textContent = `${index + 1} / ${list.length}`;
    $("lightbox-prev").disabled = index <= 0;
    $("lightbox-next").disabled = index >= list.length - 1;

    updateImage(
      $("lightbox-img"),
      $("lightbox-miss"),
      $("lightbox-miss-path"),
      path,
      title
    );
  }

  async function openLightbox() {
    if (!$("img").complete || $("img").naturalWidth === 0) return;

    focusBeforeLightbox = document.activeElement;
    lightboxOpen = true;
    $("lightbox").hidden = false;
    $("lightbox").setAttribute("aria-hidden", "false");
    renderLightbox();

    try {
      if (!document.fullscreenElement && $("lightbox").requestFullscreen) {
        await $("lightbox").requestFullscreen();
      }
    } catch (_error) {
      // Fullscreen API가 막혀 있어도 일반 오버레이로 계속 표시합니다.
    }

    $("lightbox-close").focus();
  }

  async function closeLightbox() {
    if (!lightboxOpen) return;

    lightboxOpen = false;

    try {
      if (document.fullscreenElement && document.exitFullscreen) {
        await document.exitFullscreen();
      }
    } catch (_error) {
      // 종료 실패 시에도 아래에서 오버레이를 닫습니다.
    }

    $("lightbox").hidden = true;
    $("lightbox").setAttribute("aria-hidden", "true");

    if (focusBeforeLightbox && typeof focusBeforeLightbox.focus === "function") {
      focusBeforeLightbox.focus();
    }
  }

  function loadPrintImage(element, path, altText) {
    return new Promise((resolve, reject) => {
      element.alt = altText;

      const finish = () => {
        element.onload = null;
        element.onerror = null;
      };

      const handleLoad = () => {
        finish();

        if (element.naturalWidth > 0) {
          resolve();
        } else {
          reject(new Error(`이미지 크기를 확인할 수 없습니다: ${path}`));
        }
      };

      const handleError = () => {
        finish();
        reject(new Error(`이미지를 불러오지 못했습니다: ${path}`));
      };

      element.onload = handleLoad;
      element.onerror = handleError;
      element.src = path;

      if (element.complete) {
        if (element.naturalWidth > 0) {
          handleLoad();
        } else {
          handleError();
        }
      }
    });
  }

  function pdfPath(week) {
    return `pdfs/schedule-${slug(week)}.pdf`;
  }

  function openPrintPdf() {
    if (!list.length) {
      alert("인쇄할 편성표가 없습니다.");
      return;
    }

    const week = list[index];
    const path = pdfPath(week);
    const opened = window.open(path, "_blank", "noopener,noreferrer");

    if (!opened) {
      alert(
        `PDF 창을 열지 못했습니다.
팝업 차단이 켜져 있으면 허용 후 다시 시도해 주세요.

경로: ${path}`
      );
    }
  }

  function handleKeyboard(event) {
    const tagName = document.activeElement?.tagName;
    if (tagName === "SELECT") return;

    if (event.key === "1") {
      event.preventDefault();
      setSheet("dept");
      return;
    }

    if (event.key === "2") {
      event.preventDefault();
      setSheet("team");
      return;
    }

    if (event.key === "ArrowLeft") {
      event.preventDefault();
      go(index - 1);
      return;
    }

    if (event.key === "ArrowRight") {
      event.preventDefault();
      go(index + 1);
      return;
    }

    if (event.key === "Escape" && lightboxOpen) {
      event.preventDefault();
      closeLightbox();
    }
  }

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => setSheet(tab.dataset.sheet));
  });

  $("sel-y").addEventListener("change", handleYearChange);
  $("sel-m").addEventListener("change", handleMonthChange);
  $("sel-w").addEventListener("change", jumpFromSelects);

  $("prev").addEventListener("click", () => go(index - 1));
  $("next").addEventListener("click", () => go(index + 1));
  $("lightbox-prev").addEventListener("click", () => go(index - 1));
  $("lightbox-next").addEventListener("click", () => go(index + 1));

  $("img").addEventListener("click", openLightbox);
  $("lightbox-close").addEventListener("click", closeLightbox);
  $("print-button").addEventListener("click", openPrintPdf);

  document.addEventListener("keydown", handleKeyboard);
  document.addEventListener("fullscreenchange", () => {
    if (lightboxOpen && !document.fullscreenElement) {
      lightboxOpen = false;
      $("lightbox").hidden = true;
      $("lightbox").setAttribute("aria-hidden", "true");
    }
  });

  buildRail();
  render();
})();
</script>
</body>
</html>
