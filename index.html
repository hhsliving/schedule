<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가전팀 편성표 뷰어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

<!-- ===================================================================
     편성표 데이터 — 주차가 추가되면 이 배열에만 항목을 넣으면 됩니다.
     y: 연도 / m: 월 / w: 주차 / span: 방송 기간 / cross: 월 교차 주간 여부
     이미지 파일명 규칙:  images/dept-{y}-{mm}-{w}.png   (사업부)
                          images/team-{y}-{mm}-{w}.png   (팀편성)
     =================================================================== -->
<script>
const WEEKS = [
  { y: 2026, m: 1, w: 2, span: "01/05 ~ 01/11", cross: false },
  { y: 2026, m: 1, w: 3, span: "01/12 ~ 01/18", cross: false },
  { y: 2026, m: 1, w: 4, span: "01/19 ~ 01/25", cross: false },
  { y: 2026, m: 1, w: 5, span: "01/26 ~ 02/01", cross: true  },
  { y: 2026, m: 2, w: 1, span: "02/02 ~ 02/08", cross: false },
  { y: 2026, m: 2, w: 2, span: "02/09 ~ 02/15", cross: false },
  { y: 2026, m: 2, w: 3, span: "02/16 ~ 02/22", cross: false },
  { y: 2026, m: 2, w: 4, span: "02/23 ~ 03/01", cross: true  },
  { y: 2026, m: 3, w: 1, span: "03/02 ~ 03/08", cross: false },
  { y: 2026, m: 3, w: 2, span: "03/09 ~ 03/15", cross: false },
  { y: 2026, m: 3, w: 3, span: "03/16 ~ 03/22", cross: false },
  { y: 2026, m: 3, w: 4, span: "03/23 ~ 03/29", cross: false },
  { y: 2026, m: 3, w: 5, span: "03/30 ~ 04/05", cross: true  },
  { y: 2026, m: 4, w: 2, span: "04/06 ~ 04/12", cross: false },
  { y: 2026, m: 4, w: 3, span: "04/13 ~ 04/19", cross: false },
  { y: 2026, m: 4, w: 4, span: "04/20 ~ 04/26", cross: false },
  { y: 2026, m: 4, w: 5, span: "04/27 ~ 05/03", cross: true  },
  { y: 2026, m: 5, w: 2, span: "05/04 ~ 05/10", cross: false },
  { y: 2026, m: 5, w: 3, span: "05/11 ~ 05/17", cross: false },
  { y: 2026, m: 5, w: 4, span: "05/18 ~ 05/24", cross: false },
  { y: 2026, m: 5, w: 5, span: "05/25 ~ 05/31", cross: false },
  { y: 2026, m: 6, w: 1, span: "06/01 ~ 06/07", cross: false },
  { y: 2026, m: 6, w: 2, span: "06/08 ~ 06/14", cross: false },
  { y: 2026, m: 6, w: 3, span: "06/15 ~ 06/21", cross: false },
  { y: 2026, m: 6, w: 4, span: "06/22 ~ 06/28", cross: false },
  { y: 2026, m: 6, w: 5, span: "06/29 ~ 07/05", cross: true  },
  { y: 2026, m: 7, w: 2, span: "07/06 ~ 07/12", cross: false },
  { y: 2026, m: 7, w: 3, span: "07/13 ~ 07/19", cross: false },
  { y: 2026, m: 7, w: 4, span: "07/20 ~ 07/26", cross: false },
  { y: 2026, m: 7, w: 5, span: "07/27 ~ 08/02", cross: true  },
  { y: 2026, m: 8, w: 2, span: "08/03 ~ 08/09", cross: false },
  { y: 2026, m: 8, w: 3, span: "08/10 ~ 08/16", cross: false }
];
</script>

<style>
  :root{
    /* 편성표 시트 자체의 색 언어에서 가져온 팔레트 */
    --ga:   #FFFF00;   /* 가전 */
    --li:   #FFC000;   /* 리빙 */
    --ju:   #C6E0B4;   /* 주방 */
    --hit:  #ADD8E6;   /* Hit & Best */

    --bg:      #15171B;
    --surface: #1E2128;
    --raised:  #272B33;
    --line:    #333841;
    --text:    #E9ECF1;
    --muted:   #868D99;
    --dim:     #5A616C;

    --ui: 'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', '맑은 고딕', sans-serif;
    --mono: 'JetBrains Mono', Consolas, 'D2Coding', monospace;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{ height: 100%; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------------- 상단 바 ---------------- */
  .bar{
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 18px;
    height: 46px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex: none;
  }

  .tabs{ display: flex; gap: 2px; }

  .tab{
    font-family: var(--ui);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--muted);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 8px 15px 7px;
    cursor: pointer;
    transition: color .12s;
  }
  .tab:hover{ color: var(--text); }
  .tab[aria-selected="true"]{
    color: var(--text);
    border-bottom-color: var(--ga);
  }
  .tab:focus-visible{ outline: 2px solid var(--hit); outline-offset: -2px; }

  .divider{ width: 1px; height: 22px; background: var(--line); flex: none; }

  .find{ display: flex; align-items: center; gap: 7px; }

  .find label{
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--dim);
    text-transform: uppercase;
  }

  select{
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 6px 8px;
    cursor: pointer;
  }
  select:hover{ border-color: var(--dim); }
  select:focus-visible{ outline: 2px solid var(--hit); outline-offset: 1px; }

  .meta{
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .span{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .02em;
  }

  .flag{
    font-size: 10px;
    font-weight: 700;
    color: #1A1D22;
    background: var(--li);
    border-radius: 3px;
    padding: 3px 6px;
    letter-spacing: -0.01em;
  }
  .flag[hidden]{ display: none; }

  .count{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    font-weight: 600;
    min-width: 46px;
    text-align: right;
  }

  /* ---------------- 기본 화면 뷰포트 ---------------- */
  .stage{
    flex: 1;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }

  .viewer{
    position: absolute;
    z-index: 1;
    inset: 12px 78px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .viewer img{
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    min-width: 0;
    min-height: 0;
    background: #fff;
    border-radius: 2px;
    box-shadow: 0 3px 26px rgba(0,0,0,.5);
    cursor: zoom-in;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* 위치(left/top)는 JS가 실제 이미지 가장자리에 맞춰 계산한다 */
  .nav{
    position: absolute;
    z-index: 2;
    left: 0;
    transform: translateY(-50%);
    width: 50px;
    height: 116px;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 30px;
    line-height: 1;
    padding-bottom: 4px;
    cursor: pointer;
    transition: background .12s, border-color .12s, opacity .12s, left .16s ease, top .16s ease;
  }
  .nav:hover:not(:disabled){
    background: var(--raised);
    border-color: var(--dim);
  }
  .nav:disabled{ opacity: .22; cursor: default; }
  .nav:focus-visible{ outline: 2px solid var(--hit); outline-offset: 2px; }

  .hint{
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    letter-spacing: .04em;
    pointer-events: none;
    white-space: nowrap;
  }

  .blank{
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }
  .blank code{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--hit);
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 3px;
  }

  /* -------- 주차 레일 : A안 (현행 유지 + 높이만 확보) -------- */
  .rail{
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 26px;
    height: 66px;
    padding: 0 18px 11px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
  }
  .group{ display: flex; flex-direction: column; gap: 6px; flex: none; }
  .group b{
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    color: var(--dim); letter-spacing: .1em; padding-left: 1px;
  }
  .ticks{ display: flex; gap: 3px; }
  .tick{
    position: relative; width: 30px; padding-top: 12px;
    background: none; border: 0; cursor: pointer;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--dim); transition: color .12s;
  }
  .tick::before{
    content: ""; position: absolute; top: 0; left: 0;
    width: 100%; height: 4px; border-radius: 2px;
    background: var(--line); transition: background .12s;
  }
  .tick:hover{ color: var(--text); }
  .tick:hover::before{ background: var(--dim); }
  .tick[aria-current="true"]{ color: #15171B; }
  .tick[aria-current="true"]::before{ background: var(--ga); }
  .tick[aria-current="true"] span{
    background: var(--ga); border-radius: 3px; padding: 1px 0; display: block;
  }

  /* 오늘 날짜 빨간 박스 */
  .tick[data-today="true"] span{
    display: block;
    padding: 1px 0;
    border-radius: 3px;
    box-shadow: 0 0 0 1.5px #FF3B30;
  }

  .tick[data-cross="1"]::after{
    content: ""; position: absolute; top: 0; right: -3px;
    width: 3px; height: 4px; background: var(--li);
  }
  .tick:focus-visible{ outline: 2px solid var(--hit); outline-offset: 2px; }

  /* ---------------- 전체화면 확대 뷰어 ---------------- */
  .lightbox[hidden]{ display: none; }

  .lightbox{
    position: fixed;
    z-index: 1000;
    inset: 0;
    display: grid;
    grid-template-rows: 54px minmax(0, 1fr);
    background: rgba(7, 8, 10, .96);
    backdrop-filter: blur(5px);
  }

  .lightbox-bar{
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
    padding: 0 16px 0 20px;
    background: rgba(30, 33, 40, .96);
    border-bottom: 1px solid var(--line);
  }

  .lightbox-title{
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
    overflow: hidden;
  }

  .lightbox-sheet{
    flex: none;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .lightbox-week{
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .lightbox-help{
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    letter-spacing: .02em;
    white-space: nowrap;
  }

  .lightbox-close{
    flex: none;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--raised);
    color: var(--text);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }
  .lightbox-close:hover{ border-color: var(--muted); }
  .lightbox-close:focus-visible{ outline: 2px solid var(--hit); outline-offset: 2px; }

  .lightbox-stage{
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .lightbox-view{
    position: absolute;
    inset: 12px 78px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    cursor: default;
  }

  .lightbox-view img{
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    min-width: 0;
    min-height: 0;
    object-fit: contain;
    background: #fff;
    box-shadow: 0 8px 40px rgba(0,0,0,.65);
    user-select: none;
    -webkit-user-drag: none;
  }

  .lightbox-nav{
    position: absolute;
    z-index: 2;
    top: 50%;
    transform: translateY(-50%);
    width: 54px;
    height: 132px;
    display: grid;
    place-items: center;
    color: var(--text);
    background: rgba(30, 33, 40, .92);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 34px;
    line-height: 1;
    padding-bottom: 4px;
    cursor: pointer;
  }
  .lightbox-nav.prev{ left: 12px; }
  .lightbox-nav.next{ right: 12px; }
  .lightbox-nav:hover:not(:disabled){
    background: var(--raised);
    border-color: var(--muted);
  }
  .lightbox-nav:disabled{ opacity: .2; cursor: default; }
  .lightbox-nav:focus-visible{ outline: 2px solid var(--hit); outline-offset: 2px; }

  .lightbox-counter{
    position: absolute;
    z-index: 2;
    right: 18px;
    bottom: 12px;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: rgba(30, 33, 40, .9);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    pointer-events: none;
  }

  @media (max-width: 760px){
    .bar{ gap: 10px; padding: 0 10px; }
    .divider, .find label, .lightbox-help{ display: none; }
    .find{ gap: 4px; }
    select{ font-size: 11px; padding: 5px 4px; }
    .meta{ gap: 6px; }
    .span{ display: none; }
    .viewer{ inset: 10px 48px 20px; }
    .nav{ width: 38px; height: 90px; }
    .lightbox-view{ inset: 10px 50px 14px; }
    .lightbox-nav{ width: 40px; height: 96px; }
    .lightbox-nav.prev{ left: 5px; }
    .lightbox-nav.next{ right: 5px; }
    .lightbox-bar{ padding-left: 12px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="tabs" role="tablist" aria-label="시트 선택">
    <button class="tab" role="tab" id="tab-dept" aria-selected="true" data-sheet="dept">사업부</button>
    <button class="tab" role="tab" id="tab-team" aria-selected="false" data-sheet="team">팀편성</button>
  </div>

  <div class="divider"></div>

  <div class="find">
    <label for="sel-y">찾기</label>
    <select id="sel-y" aria-label="연도"></select>
    <select id="sel-m" aria-label="월"></select>
    <select id="sel-w" aria-label="주차"></select>
  </div>

  <div class="meta">
    <span class="flag" id="flag" hidden>월 교차</span>
    <span class="span" id="span"></span>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="stage">
  <button class="nav prev" id="prev" type="button" aria-label="이전 주">‹</button>

  <div class="viewer" id="viewer">
    <img id="img" alt="">
    <div class="blank" id="miss" hidden>
      이미지를 찾을 수 없습니다<br>
      <code id="miss-path"></code><br>
      <span style="font-size:12px">images 폴더에 파일이 있는지 확인하세요</span>
    </div>
  </div>

  <button class="nav next" id="next" type="button" aria-label="다음 주">›</button>
  <div class="hint">← → 주 이동 &nbsp;·&nbsp; 1 사업부 &nbsp;·&nbsp; 2 팀편성 &nbsp;·&nbsp; 이미지 클릭하면 전체화면</div>
</div>

<div class="rail" id="rail" role="tablist" aria-label="주차 이동"></div>

<!-- 이미지 클릭 시 열리는 전체화면 확대 레이어 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="편성표 전체화면 보기" aria-hidden="true" hidden>
  <div class="lightbox-bar">
    <div class="lightbox-title">
      <strong class="lightbox-sheet" id="lightbox-sheet"></strong>
      <span class="lightbox-week" id="lightbox-week"></span>
    </div>

    <span class="lightbox-help">← → 주 이동 · 1 사업부 · 2 팀편성 · ESC 닫기</span>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="전체화면 닫기">×</button>
  </div>

  <div class="lightbox-stage" id="lightbox-stage">
    <button class="lightbox-nav prev" id="lightbox-prev" type="button" aria-label="이전 주">‹</button>

    <div class="lightbox-view" id="lightbox-view">
      <img id="lightbox-img" alt="">
      <div class="blank" id="lightbox-miss" hidden>
        이미지를 찾을 수 없습니다<br>
        <code id="lightbox-miss-path"></code><br>
        <span style="font-size:12px">images 폴더에 파일이 있는지 확인하세요</span>
      </div>
    </div>

    <button class="lightbox-nav next" id="lightbox-next" type="button" aria-label="다음 주">›</button>
    <span class="lightbox-counter" id="lightbox-counter"></span>
  </div>
</div>

<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const slug = k => `${k.y}-${pad(k.m)}-${k.w}`;
  const src = (sheetName, k) => `images/${sheetName}-${slug(k)}.png`;
  const sheetLabel = sheetName => sheetName === "dept" ? "사업부" : "팀편성";

  // 연도 → 월 → 주차 순으로 정렬 (오래된 주가 앞)
  const list = WEEKS.slice().sort((a, b) => a.y - b.y || a.m - b.m || a.w - b.w);

  let idx = list.length - 1;   // 가장 최근 주부터 보여준다
  let sheet = "dept";
  let lightboxOpen = false;
  let focusBeforeLightbox = null;

  /* ---------- 주차 레일 ---------- */
  function buildRail(){
    const rail = $("rail");
    rail.innerHTML = "";
    let group = null;
    let key = null;

    const now = new Date();
    const todayTime = now.getTime();

    list.forEach((k, i) => {
      const groupKey = `${k.y}-${k.m}`;

      if (groupKey !== key){
        key = groupKey;
        group = document.createElement("div");
        group.className = "group";

        const title = document.createElement("b");
        title.textContent = `${k.y} · ${pad(k.m)}월`;

        const ticks = document.createElement("div");
        ticks.className = "ticks";

        group.append(title, ticks);
        rail.append(group);
      }

      const tick = document.createElement("button");
      tick.className = "tick";
      tick.type = "button";
      tick.dataset.i = i;

      if (k.cross){
        tick.dataset.cross = "1";
      }

      tick.title = `${k.y}년 ${pad(k.m)}월 ${k.w}주 · ${k.span}`;
      tick.innerHTML = `<span>${k.w}주</span>`;

      // 오늘 날짜가 속한 주차 계산
      const [startStr, endStr] = k.span.split(" ~ ");
      const [sm, sd] = startStr.split("/").map(Number);
      const [em, ed] = endStr.split("/").map(Number);
      let sy = k.y;
      let ey = k.y;

      if (sm === 12 && em === 1){
        if (k.m === 1) sy = k.y - 1;
        if (k.m === 12) ey = k.y + 1;
      }

      const startTime = new Date(sy, sm - 1, sd, 0, 0, 0).getTime();
      const endTime = new Date(ey, em - 1, ed, 23, 59, 59).getTime();

      if (todayTime >= startTime && todayTime <= endTime){
        tick.dataset.today = "true";
      }

      tick.addEventListener("click", () => go(i));
      group.lastChild.append(tick);
    });
  }

  /* ---------- 찾기 드롭다운 ---------- */
  function fill(select, values, current, format){
    select.innerHTML = "";

    values.forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = format(value);

      if (value === current){
        option.selected = true;
      }

      select.append(option);
    });

    select.disabled = values.length < 2;
  }

  function syncFind(){
    const k = list[idx];
    const years = [...new Set(list.map(item => item.y))];
    const months = [...new Set(list.filter(item => item.y === k.y).map(item => item.m))];
    const weeks = [...new Set(list.filter(item => item.y === k.y && item.m === k.m).map(item => item.w))];

    fill($("sel-y"), years, k.y, value => `${value}년`);
    fill($("sel-m"), months, k.m, value => `${pad(value)}월`);
    fill($("sel-w"), weeks, k.w, value => `${value}주차`);
  }

  function jump(){
    const y = +$("sel-y").value;
    const m = +$("sel-m").value;
    const w = +$("sel-w").value;

    // 현재 선택과 가장 가까운 항목으로 이동 (연/월만 바꿔도 동작)
    let target = list.findIndex(k => k.y === y && k.m === m && k.w === w);
    if (target < 0) target = list.findIndex(k => k.y === y && k.m === m);
    if (target < 0) target = list.findIndex(k => k.y === y);
    if (target >= 0) go(target);
  }

  /* ---------- 렌더 ---------- */
  function currentAlt(){
    const k = list[idx];
    return `${k.y}년 ${pad(k.m)}월 ${k.w}주차 ${sheetLabel(sheet)} 편성표`;
  }

  function renderMainImage(){
    const k = list[idx];
    $("img").hidden = false;
    $("miss").hidden = true;
    $("img").src = src(sheet, k);
    $("img").alt = currentAlt();
  }

  function renderLightbox(){
    if (!lightboxOpen) return;

    const k = list[idx];

    $("lightbox-img").hidden = false;
    $("lightbox-miss").hidden = true;
    $("lightbox-img").src = src(sheet, k);
    $("lightbox-img").alt = currentAlt();

    $("lightbox-sheet").textContent = sheetLabel(sheet);
    $("lightbox-week").textContent = `${k.y}년 ${pad(k.m)}월 ${k.w}주차 · ${k.span}${k.cross ? " · 월 교차" : ""}`;
    $("lightbox-counter").textContent = `${idx + 1} / ${list.length}`;

    $("lightbox-prev").disabled = idx === 0;
    $("lightbox-next").disabled = idx === list.length - 1;
  }

  function render(){
    const k = list[idx];

    renderMainImage();

    $("span").textContent = k.span;
    $("count").textContent = `${idx + 1} / ${list.length}`;
    $("flag").hidden = !k.cross;

    $("prev").disabled = idx === 0;
    $("next").disabled = idx === list.length - 1;

    document.querySelectorAll(".tab").forEach(tab => {
      tab.setAttribute("aria-selected", tab.dataset.sheet === sheet);
    });

    document.querySelectorAll(".tick").forEach(tick => {
      tick.setAttribute("aria-current", +tick.dataset.i === idx);
    });

    document.querySelector(`.tick[data-i="${idx}"]`)
      ?.scrollIntoView({ block: "nearest", inline: "nearest" });

    syncFind();
    renderLightbox();
  }

  function go(nextIndex){
    idx = Math.max(0, Math.min(list.length - 1, nextIndex));
    render();
  }

  function selectSheet(nextSheet){
    if (nextSheet !== "dept" && nextSheet !== "team") return;
    if (sheet === nextSheet) return;
    sheet = nextSheet;
    render();
  }

  /* ---------- 기본 화면 좌우 버튼 위치 ---------- */
  const GAP = 14;

  function placeNav(){
    const stage = document.querySelector(".stage");
    const prev = $("prev");
    const next = $("next");
    const image = $("img");
    const stageBox = stage.getBoundingClientRect();

    const box = image.hidden || !image.naturalWidth
      ? $("viewer").getBoundingClientRect()
      : image.getBoundingClientRect();

    const buttonWidth = prev.offsetWidth || 50;
    const left = box.left - stageBox.left - GAP - buttonWidth;
    const right = box.right - stageBox.left + GAP;
    const centerY = box.top - stageBox.top + box.height / 2;

    prev.style.left = Math.max(4, left) + "px";
    next.style.left = Math.min(stageBox.width - buttonWidth - 4, right) + "px";
    prev.style.top = next.style.top = centerY + "px";
  }

  addEventListener("resize", placeNav);

  if (window.ResizeObserver){
    new ResizeObserver(placeNav).observe(document.querySelector(".stage"));
  }

  /* ---------- 전체화면 열기 / 닫기 ---------- */
  function openLightbox(){
    if (lightboxOpen || $("img").hidden) return;

    lightboxOpen = true;
    focusBeforeLightbox = document.activeElement;

    $("lightbox").hidden = false;
    $("lightbox").setAttribute("aria-hidden", "false");
    renderLightbox();

    requestAnimationFrame(() => {
      $("lightbox-close").focus({ preventScroll: true });
    });
  }

  function closeLightbox(){
    if (!lightboxOpen) return;

    lightboxOpen = false;
    $("lightbox").hidden = true;
    $("lightbox").setAttribute("aria-hidden", "true");

    if (focusBeforeLightbox instanceof HTMLElement){
      focusBeforeLightbox.focus({ preventScroll: true });
    }

    focusBeforeLightbox = null;
  }

  /* ---------- 이미지 오류 / 로드 ---------- */
  $("img").addEventListener("error", () => {
    $("img").hidden = true;
    $("miss").hidden = false;
    $("miss-path").textContent = src(sheet, list[idx]);
    placeNav();
  });

  $("img").addEventListener("load", () => {
    $("img").hidden = false;
    $("miss").hidden = true;
    placeNav();
  });

  $("lightbox-img").addEventListener("error", () => {
    $("lightbox-img").hidden = true;
    $("lightbox-miss").hidden = false;
    $("lightbox-miss-path").textContent = src(sheet, list[idx]);
  });

  $("lightbox-img").addEventListener("load", () => {
    $("lightbox-img").hidden = false;
    $("lightbox-miss").hidden = true;
  });

  /* ---------- 마우스 이벤트 ---------- */
  $("viewer").addEventListener("click", event => {
    if (event.target === $("img")){
      openLightbox();
    }
  });

  $("lightbox-close").addEventListener("click", closeLightbox);

  $("lightbox-prev").addEventListener("click", () => go(idx - 1));
  $("lightbox-next").addEventListener("click", () => go(idx + 1));

  // 편성표 이미지나 버튼이 아닌 어두운 배경을 누르면 닫기
  $("lightbox-stage").addEventListener("click", event => {
    if (
      event.target === $("lightbox-stage") ||
      event.target === $("lightbox-view")
    ){
      closeLightbox();
    }
  });

  /* ---------- 기본 화면 이벤트 ---------- */
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => selectSheet(tab.dataset.sheet));
  });

  $("prev").addEventListener("click", () => go(idx - 1));
  $("next").addEventListener("click", () => go(idx + 1));

  ["sel-y", "sel-m", "sel-w"].forEach(id => {
    $(id).addEventListener("change", jump);
  });

  /* ---------- 키보드 ---------- */
  addEventListener("keydown", event => {
    const target = event.target;

    if (target instanceof HTMLSelectElement){
      return;
    }

    if (event.key === "Escape" && lightboxOpen){
      closeLightbox();
      event.preventDefault();
      return;
    }

    if (event.key === "ArrowLeft"){
      go(idx - 1);
      event.preventDefault();
      return;
    }

    if (event.key === "ArrowRight"){
      go(idx + 1);
      event.preventDefault();
      return;
    }

    if (event.key === "1"){
      selectSheet("dept");
      event.preventDefault();
      return;
    }

    if (event.key === "2"){
      selectSheet("team");
      event.preventDefault();
    }
  });

  /* ---------- 시작 ---------- */
  if (!list.length){
    document.querySelector(".stage").innerHTML =
      `<div class="blank">등록된 편성표가 없습니다<br>
       <span style="font-size:12px">HTML 상단의 <code>WEEKS</code> 배열에 주차를 추가하세요</span></div>`;
  } else {
    buildRail();
    render();
  }
})();
</script>
</body>
</html>
