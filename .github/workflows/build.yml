name: 편성표 이미지 생성

on:
  push:
    paths:
      - 'weeks/**.xlsx'
      - 'weeks/**/*.xlsx'
      - 'tools/**.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      week_start:
        description: "Inclusive start week (YYYY-MM-W, e.g. 2026-08-2)"
        required: false
        type: string
      week_end:
        description: "Inclusive end week (YYYY-MM-W, e.g. 2026-10-4)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: schedule-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 실행 모드 설정
        shell: bash
        env:
          REQUESTED_START: ${{ inputs.week_start }}
          REQUESTED_END: ${{ inputs.week_end }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "$REQUESTED_START" || -n "$REQUESTED_END" ]]; then
              if [[ ! "$REQUESTED_START" =~ ^[0-9]{4}-[0-9]{2}-[1-6]$ ]] || [[ ! "$REQUESTED_END" =~ ^[0-9]{4}-[0-9]{2}-[1-6]$ ]]; then
                echo "::error::주차 범위는 YYYY-MM-W 형식으로 모두 입력해야 합니다."
                exit 1
              fi
              printf 'WEEKS_START=%s\n' "$REQUESTED_START" >> "$GITHUB_ENV"
              printf 'WEEKS_END=%s\n' "$REQUESTED_END" >> "$GITHUB_ENV"
              echo "FULL_REBUILD=0" >> "$GITHUB_ENV"
            else
              echo "FULL_REBUILD=1" >> "$GITHUB_ENV"
            fi
          else
            commit_subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
            range_pattern='^\[rebuild-range\][[:space:]]+([0-9]{4}-[0-9]{2}-[1-6])\.\.([0-9]{4}-[0-9]{2}-[1-6])$'
            if [[ "$commit_subject" =~ $range_pattern ]]; then
              printf 'WEEKS_START=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
              printf 'WEEKS_END=%s\n' "${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
            fi
            echo "FULL_REBUILD=0" >> "$GITHUB_ENV"
          fi

          echo "PUSH_BEFORE=${{ github.event.before }}" >> "$GITHUB_ENV"

      - name: 필요한 프로그램 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq             libreoffice-calc             poppler-utils             fonts-noto-cjk             fonts-crosextra-carlito

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 파이썬 패키지 설치
        run: pip install --quiet openpyxl pillow

      - name: 이미지 생성 및 index.html 갱신
        run: python3 tools/batch.py

      - name: 변경분 커밋
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images pdfs index.html weeks/.pairs.json

          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "편성표 이미지 갱신 ($(date +%Y-%m-%d))"
            git push
          fi
