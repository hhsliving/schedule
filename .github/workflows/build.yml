name: 편성표 이미지 생성

on:
  push:
    paths:
      - 'weeks/**.xlsx'
      - 'tools/**.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 실행 모드 설정
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "FULL_REBUILD=1" >> "$GITHUB_ENV"
          else
            echo "FULL_REBUILD=0" >> "$GITHUB_ENV"
          fi

          echo "PUSH_BEFORE=${{ github.event.before }}" >> "$GITHUB_ENV"

      - name: 필요한 프로그램 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libreoffice-calc \
            poppler-utils \
            fonts-noto-cjk \
            fonts-crosextra-carlito

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 파이썬 패키지 설치
        run: pip install --quiet openpyxl pillow

      - name: 이미지 생성 및 index.html 갱신
        run: python3 tools/batch.py

      - name: 변경분 커밋
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images index.html weeks/.pairs.json

          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "편성표 이미지 갱신 ($(date +%Y-%m-%d))"
            git push
          fi
